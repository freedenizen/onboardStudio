<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>OverlayGen (small sizes)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C424B"/>
      <stop offset="0.52" stop-color="#252A31"/>
      <stop offset="1" stop-color="#14171B"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF9E1A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Big Sur body: 824 x 824 centred in a 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>

  <!-- No ticks, a fatter sweep and a blunt needle: at 16 px only these survive. -->
  <path d="M 299.87 748.13 A 300 300 0 1 1 724.13 748.13" fill="none" stroke="#474D55"
        stroke-width="84" stroke-linecap="round"/>
  <path d="M 299.87 748.13 A 300 300 0 1 1 754.71 359.66" fill="none" stroke="url(#sweep)"
        stroke-width="84" stroke-linecap="round"/>

  <path d="M 709.40 392.58 L 480.26 492.31 L 512.00 536.00 L 543.74 579.69 Z" fill="#FFFFFF"/>
  <circle cx="512" cy="536" r="58" fill="#FFFFFF"/>
  <circle cx="512" cy="536" r="24" fill="#14171B"/>
</svg>
