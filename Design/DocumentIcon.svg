<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Onboard Studio Project</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7E9EC"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9CDD3"/>
      <stop offset="1" stop-color="#EDEFF2"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF9E1A"/>
    </linearGradient>
  </defs>

  <!-- Page with a folded top-right corner. -->
  <path d="M 196 60 L 646 60 L 842 256 L 842 950
           Q 842 964 828 964 L 196 964 Q 182 964 182 950
           L 182 74 Q 182 60 196 60 Z" fill="url(#page)"/>
  <path d="M 646 60 L 842 256 L 660 256
           Q 646 256 646 242 Z" fill="url(#fold)"/>

  <!-- Title lines, so the page reads as a document at a glance. -->
  <rect x="254" y="228" width="300" height="26" rx="13" fill="#C2C7CE"/>
  <rect x="254" y="292" width="196" height="26" rx="13" fill="#D5D9DE"/>

