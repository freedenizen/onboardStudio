name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate --quiet
      - name: Build app (unsigned)
        run: |
          xcodebuild -project OverlayGen.xcodeproj -scheme OverlayGen -configuration Debug \
            -destination 'generic/platform=macOS' CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            -derivedDataPath build/DerivedData build | tail -20
