name: CI
on:
  push:
    branches: [main]
  pull_request:
# A newer push to a branch supersedes the run in progress; a push to main never does — a
# cancelled main run reports its shards as failed and `main health` would call main red
# for a commit nothing was wrong with.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  # Two lint jobs: the checks that need the Swift toolchain (or `sips`) run on macOS; the rest run
  # on Linux, which is preinstalled with shellcheck and starts in seconds. Both are required.
  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
      - name: swift format
        run: swift format lint --strict --recursive Sources Tests UITests Package.swift
      # A pinned portable binary: `brew install swiftlint` resolved a formula and its
      # dependencies on every run, and flaked once doing it.
      - name: SwiftLint
        env:
          SWIFTLINT_VERSION: 0.65.1
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --reporter github-actions-logging
      - name: Icons
        run: Scripts/check-icons.sh

  lint-fast:
    name: Lint (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -ignore SC2012 -ignore SC2086
      - name: Shell scripts
        run: shellcheck -S warning Scripts/*.sh .githooks/*
      - name: UI test shards
        run: Scripts/check-ui-test-shards.sh

  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - uses: actions/cache@v6
        with:
          path: .build
          # The repository name is part of the runner's workspace path, and Clang bakes that
          # absolute path into the precompiled headers inside .build. Keying on it means a cache
          # is only ever restored into the same path it was built at; renaming the repo (or a
          # fork) starts fresh instead of restoring unusable .pcm files.
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ github.event.repository.name }}-
      - name: Build
        run: swift build
      # Coverage instrumentation costs ~80 s on a ~30 s test run, and nothing gates on the report,
      # so a PR runs the suite plain; the push to main keeps the report and the artifact.
      - name: Test
        if: github.event_name == 'pull_request'
        run: swift test --parallel
      - name: Test with coverage
        if: github.event_name != 'pull_request'
        run: swift test --enable-code-coverage --parallel
      - name: Coverage report
        if: github.event_name != 'pull_request'
        run: |
          PROFDATA=$(find .build -name 'default.profdata' | head -1)
          BIN=$(find .build -name 'OnboardStudioPackageTests.xctest' -type d | head -1)/Contents/MacOS/OnboardStudioPackageTests
          xcrun llvm-cov report "$BIN" -instr-profile "$PROFDATA" -ignore-filename-regex='(\.build|Tests)/' | tee coverage.txt
          xcrun llvm-cov export "$BIN" -instr-profile "$PROFDATA" -format=lcov -ignore-filename-regex='(\.build|Tests)/' > coverage.lcov
          { echo '### Coverage'; echo '```'; tail -1 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.lcov
      - name: CLI smoke
        run: swift run onboard --version

  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does this change touch the app?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Anything not a pull request (i.e. a push to main) always runs the suite.
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `ci.yml` is in the list because the build-once/upload/download/shard plumbing the
          # suite runs on lives in this file: a change to it that skipped the suite would be a
          # change to the UI tests that the UI tests never saw (#142).
          if git diff --name-only "$BASE" "$HEAD" |
            grep -qE '^(Sources/OnboardStudioApp/|UITests/|project\.yml$|\.github/workflows/ci\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # Compiles the app and the UI test bundle once. The shards below reuse the products, so the
  # ~2 minute compile is paid once rather than once per shard. This also replaces the old
  # "Build app" job, which compiled a strict subset of the same thing.
  ui-tests-build:
    name: UI tests (build)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate --quiet
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project OnboardStudio.xcodeproj -scheme OnboardStudio \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual | tail -20
      # Tarred, not uploaded as a directory: the upload does not preserve the executable bit, so
      # the app and the test runner come back unlaunchable ("Launchd job spawn failed").
      - name: Pack the built products
        run: |
          tar -C build/DerivedData/Build -cf products.tar Products
          # The generated project travels too, so a shard needs neither brew nor xcodegen —
          # which was costing each of them over a minute before the tests even started.
          tar -rf products.tar OnboardStudio.xcodeproj
      - name: Keep the built products for the shards
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-products
          path: products.tar
          retention-days: 1
          if-no-files-found: error

  # Sharded across runners rather than parallelised on one: parallel macOS UI test workers run
  # several copies of the app on a single screen, fighting over the key window and the menu bar.
  # Shards are balanced by measured per-class time (see #100).
  ui-tests-shard:
    name: UI tests (${{ matrix.name }})
    needs: [changes, ui-tests-build]
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard 1
            classes: ObjectEditingUITests TrimUITests MarkerUITests DataEditingUITests AttributeMappingUITests
          - name: shard 2
            classes: JourneyUITests TemplateUITests LauncherUITests SplitUITests ImportReportUITests FontUITests
          - name: shard 3
            classes: FirstLaunchUITests SyncUITests MultiCameraUITests LapUITests ProjectUITests TimelineUITests DetailsUITests ActivityUITests
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
      - uses: actions/download-artifact@v8
        with:
          name: ui-tests-products
      - name: Unpack the built products
        run: |
          mkdir -p build/DerivedData/Build
          tar -xf products.tar OnboardStudio.xcodeproj
          tar -C build/DerivedData/Build -xf products.tar Products
      - name: Run XCUITests
        env:
          CLASSES: ${{ matrix.classes }}
        run: |
          set -o pipefail
          export ONBOARD_TEST_EXPORT_DIR="$RUNNER_TEMP/exports"
          mkdir -p "$ONBOARD_TEST_EXPORT_DIR"
          only=()
          for class in $CLASSES; do only+=("-only-testing:OnboardStudioUITests/$class"); done
          # A test that fails is run once more before the shard is called red: a lost key window
          # or a menu that opened late used to cost a full rerun of the workflow. The retry is
          # reported below so a flake is still a fact on record, not a silent pass.
          xcodebuild test-without-building -project OnboardStudio.xcodeproj -scheme OnboardStudio \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            "${only[@]}" -resultBundlePath build/UITests.xcresult CODE_SIGN_IDENTITY="-" \
            -retry-tests-on-failure -test-iterations 2 \
            | tee xcodebuild.log | grep -E "error:|Test Case|Executed|TEST "
      # Not on a pull request from a fork: its token is read-only whatever the job asks for, and
      # the write would fail the shard for a test that passed.
      - name: Record a test that passed only on retry
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHARD: ${{ matrix.name }}
        run: |
          # xcodebuild logs a failed attempt as "failed" and the retry as a later "passed" for the
          # same test case; a case that shows both is a flake. The identifier is "-[Class method]",
          # with a space inside it, so the fields are tab-separated rather than split on blanks.
          flaky=$(grep -E "^Test Case '.*' (failed|passed)" xcodebuild.log \
            | sed -E $'s/^Test Case \'([^\']*)\' (failed|passed).*/\\1\t\\2/' \
            | awk -F'\t' '{ seen[$1] = seen[$1] " " $2 } END { for (t in seen) if (seen[t] ~ /failed/ && seen[t] ~ /passed/) print t }')
          [ -z "$flaky" ] && exit 0
          echo "::warning::Passed only on retry: $flaky"
          Scripts/report-ci-issue.sh open flaky-tests "UI tests that pass only on retry" \
            "$RUN_URL ($SHARD): $flaky"
      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-xcresult-${{ strategy.job-index }}
          path: build/UITests.xcresult

  # `main` requires a check named exactly "UI tests", so this reports for the shards above. It
  # must run even when they are skipped: a required check that never reports blocks the merge
  # forever, which is why the path filter skips the work and not this job.
  ui-tests:
    name: UI tests
    needs: [changes, ui-tests-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the shard results
        env:
          DETECTED: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          RESULT: ${{ needs.ui-tests-shard.result }}
        run: |
          # A failed detector produces no outputs, so APP is empty — which must not be read as
          # "the app was untouched". That would skip every shard and still report green.
          if [ "$DETECTED" != "success" ]; then
            echo "::error::Detect app changes did not succeed ($DETECTED); the shards were skipped without knowing whether they were needed. Re-run the workflow."
            exit 1
          fi
          if [ "$APP" != "true" ]; then
            echo "No change to Sources/OnboardStudioApp, UITests or project.yml — suite not needed."
            exit 0
          fi
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ]

  verify-signatures:
    name: Verify commit signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify every new commit is signed by an allowed key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A commit passes if either (a) git verifies its SSH signature against
          # .github/allowed_signers, or (b) it is a squash/merge commit created and signed by
          # GitHub itself (committer noreply@github.com, verified). Contributor keys registered
          # on GitHub are deliberately NOT trusted here; they must be in allowed_signers.
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || RANGE="${{ github.sha }}~5..${{ github.sha }}"
          fi
          echo "Checking $RANGE"
          fail=0
          for c in $(git rev-list "$RANGE"); do
            local_status=$(git log -1 --format='%G?' "$c" 2>/dev/null || echo "?")
            github_signed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${c}" \
              --jq 'if .commit.verification.verified == true and .commit.committer.email == "noreply@github.com" then "true" else "false" end' \
              2>/dev/null || echo "false")
            printf '%s local=%s github-merge=%s %s\n' "$c" "$local_status" "$github_signed" "$(git log -1 --format=%s "$c")"
            if [[ "$local_status" != "G" && "$github_signed" != "true" ]]; then fail=1; fi
          done
          [[ $fail -eq 0 ]] || { echo "::error::One or more commits are neither signed by a key in .github/allowed_signers nor verified by GitHub"; exit 1; }

  # `main` is not required to be up to date before a merge (two green PRs can still conflict once
  # combined), so the push run is what proves `main` itself. When it is red this opens — or adds
  # to — the one issue labelled `main-red`, and closes it when the next push is green; the fix is
  # to fix forward, not to leave it. Only on push: a PR's failures are visible on the PR.
  main-health:
    name: main health
    needs: [lint, lint-fast, test, ui-tests, verify-signatures]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open or update the red-main issue
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<< "$RESULTS" | paste -sd, -)
          Scripts/report-ci-issue.sh open main-red \
            "main is red as of ${SHA:0:7}" \
            "$RUN_URL failed on \`${SHA:0:7}\` (jobs: $failed). Fix forward; this issue closes itself on the next green push."
      - name: Close it once green
        if: "!(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: Scripts/report-ci-issue.sh close main-red "Green again at \`${SHA:0:7}\`."
