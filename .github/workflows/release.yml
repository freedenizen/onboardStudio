name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Before anything is built: a release that adds features opens its page with What's New
      # as written for drivers (#702), and an hour's build should not end by finding none.
      - name: Written release notes
        run: Scripts/release-notes.sh --check "$GITHUB_REF_NAME"
      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          echo "version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')" >> "$GITHUB_OUTPUT"
      - name: Tools
        run: brew install xcodegen create-dmg
      - name: Resolve packages (fetches Sparkle tools)
        run: swift package resolve
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')" >> $GITHUB_ENV
      - name: Build app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: VERSION="${VERSION#v}" Scripts/bundle-app.sh
      - name: Notarize app
        if: env.HAS_NOTARY == 'true' && env.SIGNING_IDENTITY != ''
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8" > $RUNNER_TEMP/AuthKey.p8
          NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8 Scripts/notarize.sh dist/OnboardStudio.app
      - name: Make DMG
        run: Scripts/make-dmg.sh
      - name: Notarize DMG
        if: env.HAS_NOTARY == 'true' && env.SIGNING_IDENTITY != ''
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8" > $RUNNER_TEMP/AuthKey.p8
          NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8 Scripts/notarize.sh dist/OnboardStudio-*.dmg
      - name: Keep the DMG for inspection when notarization fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dmg-unnotarized
          path: dist/*.dmg
          retention-days: 3
      - name: Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: Scripts/make-appcast.sh
      # With its resource bundles, and run from the archive before it is published (#662). Signed
      # with the app's Developer ID and notarized when the secrets are there (#683): the script
      # signs when SIGNING_IDENTITY is set, and notarizes when the notary's key is as well.
      - name: CLI tarball
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [[ -n "$NOTARY_KEY_ID" ]]; then
            echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          fi
          Scripts/make-cli-archive.sh "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
          # What's New from docs/releases, then the features and fixes: not GitHub's list of
          # every pull request's title (#702).
          Scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "${{ github.ref_name }}" $PRERELEASE --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/OnboardStudio-*.dmg dist/appcast.xml dist/onboard-cli-*.tar.gz
