name: OnboardStudio
options:
  bundleIdPrefix: com.freedenizen
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.21.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  OnboardStudioPackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  OnboardStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/OnboardStudioApp
      - path: App/Assets.xcassets
      - path: App/DocumentIcon.icns
        buildPhase: resources
      - path: App/Sample.onboardproj
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Onboard Studio
        CFBundleDisplayName: Onboard Studio
        CFBundleIdentifier: com.freedenizen.onboardstudio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "MIT License"
        SUFeedURL: https://github.com/freedenizen/onboardStudio/releases/latest/download/appcast.xml
        SUPublicEDKey: F/7BM7lVhYVQxvRAW7G4ugBaJZ4UkOyjUf0YTCVLLcc=
        SUEnableInstallerLauncherService: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Onboard Studio Project
            CFBundleTypeRole: Editor
            CFBundleTypeIconFile: DocumentIcon
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - com.freedenizen.onboardstudio.project
              - com.freedenizen.overlaygen.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.freedenizen.onboardstudio.project
            UTTypeDescription: Onboard Studio Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [onboardproj]
          - UTTypeIdentifier: com.freedenizen.onboardstudio.template
            UTTypeDescription: Onboard Studio Template
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [onboardtemplate]
          - UTTypeIdentifier: com.freedenizen.onboardstudio.style
            UTTypeDescription: Onboard Studio Object Style
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [onboardstyle]
          - UTTypeIdentifier: com.freedenizen.onboardstudio.track
            UTTypeDescription: Onboard Studio Track Definition
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [onboardtrack]
        # Documents written by OverlayGen, this app's former name. Declared as imported types so
        # projects, templates and styles saved before the rename still open; new files are written
        # with the exported types above.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.freedenizen.overlaygen.project
            UTTypeDescription: OverlayGen Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [overlayproj]
          - UTTypeIdentifier: com.freedenizen.overlaygen.template
            UTTypeDescription: OverlayGen Template
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [overlaytemplate]
          - UTTypeIdentifier: com.freedenizen.overlaygen.style
            UTTypeDescription: OverlayGen Object Style
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [overlaystyle]
    entitlements:
      path: App/OnboardStudio.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    dependencies:
      - package: OnboardStudioPackage
        product: ProjectModel
      - package: OnboardStudioPackage
        product: TelemetryKit
      - package: OnboardStudioPackage
        product: Importers
      - package: OnboardStudioPackage
        product: GPMFKit
      - package: OnboardStudioPackage
        product: RenderKit
      - package: OnboardStudioPackage
        product: MediaKit
      - package: OnboardStudioPackage
        product: Scripting
      - package: OnboardStudioPackage
        product: YouTubeKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freedenizen.onboardstudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  OnboardStudioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/OnboardStudioUITests
    dependencies:
      - target: OnboardStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freedenizen.onboardstudio.uitests
        TEST_TARGET_NAME: OnboardStudio
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  OnboardStudio:
    build:
      targets:
        OnboardStudio: all
        OnboardStudioUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnboardStudioUITests
      environmentVariables:
        ONBOARD_FIXTURES: $(SRCROOT)/Tests/Fixtures
    archive:
      config: Release
