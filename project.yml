name: OverlayGen
options:
  bundleIdPrefix: com.freedenizen
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.19.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  OverlayGenPackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  OverlayGen:
    type: application
    platform: macOS
    sources:
      - path: Sources/OverlayGenApp
      - path: App/Assets.xcassets
      - path: App/DocumentIcon.icns
        buildPhase: resources
      - path: App/Sample.overlayproj
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: OverlayGen
        CFBundleDisplayName: OverlayGen
        CFBundleIdentifier: com.freedenizen.overlaygen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "MIT License"
        SUFeedURL: https://github.com/freedenizen/overlayGen/releases/latest/download/appcast.xml
        SUPublicEDKey: F/7BM7lVhYVQxvRAW7G4ugBaJZ4UkOyjUf0YTCVLLcc=
        SUEnableInstallerLauncherService: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: OverlayGen Project
            CFBundleTypeRole: Editor
            CFBundleTypeIconFile: DocumentIcon
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.freedenizen.overlaygen.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.freedenizen.overlaygen.project
            UTTypeDescription: OverlayGen Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [overlayproj]
          - UTTypeIdentifier: com.freedenizen.overlaygen.template
            UTTypeDescription: OverlayGen Template
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [overlaytemplate]
          - UTTypeIdentifier: com.freedenizen.overlaygen.style
            UTTypeDescription: OverlayGen Object Style
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [overlaystyle]
    entitlements:
      path: App/OverlayGen.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    dependencies:
      - package: OverlayGenPackage
        product: ProjectModel
      - package: OverlayGenPackage
        product: TelemetryKit
      - package: OverlayGenPackage
        product: Importers
      - package: OverlayGenPackage
        product: GPMFKit
      - package: OverlayGenPackage
        product: RenderKit
      - package: OverlayGenPackage
        product: MediaKit
      - package: OverlayGenPackage
        product: Scripting
      - package: OverlayGenPackage
        product: YouTubeKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freedenizen.overlaygen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  OverlayGenUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/OverlayGenUITests
    dependencies:
      - target: OverlayGen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freedenizen.overlaygen.uitests
        TEST_TARGET_NAME: OverlayGen
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  OverlayGen:
    build:
      targets:
        OverlayGen: all
        OverlayGenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OverlayGenUITests
      environmentVariables:
        OVERLAYGEN_FIXTURES: $(SRCROOT)/Tests/Fixtures
    archive:
      config: Release
